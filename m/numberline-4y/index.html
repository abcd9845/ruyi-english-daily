<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>如意 · 数轴月考（四年级）｜带图练习</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1917;--muted:#78716c;--accent:#0f766e;--accent-soft:#ccfbf1;--line:#e7e5e4;--warn:#b45309;--ok:#15803d;--bad:#b91c1c;--radius:16px;--shadow:0 8px 24px rgba(28,25,23,.06)}
*{box-sizing:border-box}
body{margin:0;padding:14px 14px 90px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#d1fae5 0%,transparent 50%),radial-gradient(900px 500px at 100% 0%,#fde68a 0%,transparent 45%),var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto}
header,.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h1{font-size:1.22rem;margin:0 0 6px}
.meta{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#0f766e);transition:width .2s}
.qno{font-weight:700;color:var(--accent);margin:0 0 6px}
.stem{white-space:pre-wrap;word-break:break-word;font-size:1rem;margin:0 0 10px}
.fig{margin:6px 0 12px}
.fig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.fig.optfig{margin:4px 0 4px 30px}
.fig.optfig img{max-width:min(100%,360px)}
.noimg{display:flex;align-items:center;justify-content:center;min-height:84px;background:#e7e5e4;color:#57534e;border-radius:12px;font-size:.92rem;font-weight:600;margin:6px 0 12px;text-align:center;padding:8px}
.noimg button{margin-left:10px;padding:6px 12px;font-size:.82rem}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0 0;background:#fafaf9;cursor:pointer}
.opt input{margin-top:.35em;width:18px;height:18px;flex:none}
.opt .k{font-weight:700;color:var(--accent);flex:none}
.opt span.t{white-space:pre-wrap;word-break:break-word}
.opt.sel{border-color:var(--accent);background:#f0fdfa}
input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fafaf9}
input:focus{outline:none;border-color:var(--accent);background:#fff}
button{appearance:none;border:none;border-radius:999px;padding:12px 18px;font-size:.95rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:#f5f5f4;color:var(--ink)}.btn-submit{background:#b45309;color:#fff}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.sticky button{flex:1;min-width:90px;max-width:200px;padding:11px 8px}
.msg{margin-top:8px;font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--muted)}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;font-size:.92rem;color:#9a3412}
#gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#gate .box{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.08)}
#gate h2{margin:0 0 8px;font-size:1.15rem}
a{color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateForm" autocomplete="off">
    <h2>家庭专用</h2>
    <p class="meta" style="margin:0 0 12px">输入家庭码后才能查看练习。</p>
    <input id="gateInput" type="password" placeholder="家庭码" autocomplete="off" autocapitalize="off" />
    <button id="gateBtn" type="submit" class="btn-primary" style="margin-top:12px;width:100%">进入</button>
    <p id="gateErr" class="msg bad" style="min-height:1.3em"></p>
  </form>
</div>

<div class="wrap">
  <header>
    <h1>如意 · 数轴月考（四年级）<span class="pill" id="countPill">加载中</span></h1>
    <div class="meta">带图练习 · 图在题干下方 · 草稿自动保存在本机</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta" id="savedHint" style="margin-top:8px"></div>
  </header>
  <div id="status"></div>
  <div id="qs"></div>
  <p class="meta"><a href="../../">每日一练</a> · <a href="../../days/">往日归档</a></p>
  <footer>如意 · 练习站 · 提交后由家长先看一眼，再录入大脑</footer>
</div>

<div class="sticky" id="actions" style="display:none">
  <button type="button" class="btn-submit" id="btnSubmit">提交给爆米花</button>
  <button type="button" class="btn-ghost" id="btnClear">清空</button>
  <button type="button" class="btn-ghost" id="btnLogout">退出</button>
</div>

<script>
(function(){
'use strict';
var SOURCE='math-intake.zz-yuekao-numberline-4y';
var DRAFT_KEY='ruyi-mi-numberline-4y-v1';
var $=function(id){return document.getElementById(id);};
var items=[], ntfyUrl=null, answers={}, saveTimer=null, checkSubmitted=false;

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function setStatus(kind,text,retry){
  var s=$('status'); s.innerHTML='';
  if(!text) return;
  var d=el('div','card notice',text);
  if(retry){var b=el('button','btn-primary','重试');b.style.marginLeft='10px';b.onclick=retry;d.appendChild(b);}
  s.appendChild(d);
}
function showGate(msg){
  $('gate').style.display='flex'; $('actions').style.display='none';
  $('gateErr').textContent=msg||''; $('gateInput').value=''; setTimeout(function(){$('gateInput').focus();},50);
}
function hideGate(){ $('gate').style.display='none'; }

// ---- api ------------------------------------------------------------------
function api(method,path,body){
  var opt={method:method,credentials:'same-origin',headers:{}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch(path,opt).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=JSON.parse(t); }catch(e){}
      return {status:r.status,json:j};
    });
  });
}

// ---- start ----------------------------------------------------------------
function start(){
  setStatus('', '');
  api('GET','/api/session').then(function(r){
    if(r.status!==200 || !r.json || typeof r.json.authenticated!=='boolean'){
      $('countPill').textContent='不可用';
      setStatus('', '这个页面需要在家庭站（带服务端的地址）打开才能看到带图题目。如果你在 GitHub Pages 上看到这条提示，请改用家里的练习站地址。旧的练习页不受影响。');
      return;
    }
    if(!r.json.authenticated){ showGate(''); return; }
    hideGate(); load();
  }).catch(function(){
    $('countPill').textContent='离线';
    setStatus('', '连不上练习站服务，请检查网络后重试。', start);
  });
}

function load(){
  $('countPill').textContent='加载中';
  setStatus('', '');
  Promise.all([api('GET','/api/config'), api('GET','/api/sets/'+SOURCE)]).then(function(rs){
    var cfg=rs[0], sets=rs[1];
    if(cfg.status===401 || sets.status===401){ showGate('登录已过期，请重新输入家庭码'); return; }
    ntfyUrl = (cfg.json && typeof cfg.json.ntfy_url==='string' && /^https:\/\/ntfy\.sh\/[A-Za-z0-9_-]+$/.test(cfg.json.ntfy_url)) ? cfg.json.ntfy_url : null;
    if(sets.status!==200 || !sets.json || !Array.isArray(sets.json.items)){
      $('countPill').textContent='题库不可用';
      var m=(sets.json && sets.json.message) ? sets.json.message : '题库暂时连不上';
      setStatus('', m+'。你仍可以先看旧的练习页；稍后点「重试」。', load);
      $('qs').innerHTML=''; $('actions').style.display='none';
      return;
    }
    items=sets.json.items;
    loadDraft();
    render();
    $('actions').style.display='flex';
    updateSubmitButton();
  }).catch(function(){
    $('countPill').textContent='离线';
    setStatus('', '连不上练习站服务，请检查网络后重试。', load);
  });
}

// ---- draft (no family code is ever stored) ----------------------------------
function loadDraft(){
  answers={};
  try{
    var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');
    if(d && typeof d.a==='object' && d.a) answers=d.a;
  }catch(e){}
}
function saveDraftNow(){
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({v:1,a:answers,t:new Date().toISOString()}));
    $('savedHint').textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){}
  updateProgress();
}
function saveDraft(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDraftNow,250); }
function filled(q){ var v=answers[q.qref]; return typeof v==='string' && v.trim()!==''; }
function updateProgress(){
  var n=0; items.forEach(function(q){ if(filled(q)) n++; });
  $('bar').style.width = items.length? Math.round(n/items.length*100)+'%' : '0';
  $('countPill').textContent = '已答 '+n+' / '+items.length;
}

// ---- render ----------------------------------------------------------------
function safeSrc(u){ return typeof u==='string' && u.indexOf('/api/media/')===0 && u.indexOf('..')<0 && u.indexOf('?')<0 ? u : null; }

function makeImg(m, cls){
  var src=safeSrc(m.url); if(!src) return null;
  var wrap=el('div','fig '+(cls||''));
  var img=document.createElement('img');
  img.loading='lazy'; img.decoding='async'; img.alt=m.alt||'题目配图'; img.src=src;
  img.onerror=function(){
    var box=el('div','noimg','图加载失败');
    var b=el('button','btn-ghost','重试');
    b.onclick=function(){ box.replaceWith(wrap); img.src=src+'?r='+Date.now().toString(36); };
    box.appendChild(b); wrap.replaceWith(box);
  };
  wrap.appendChild(img);
  return wrap;
}

function render(){
  var root=$('qs'); root.innerHTML='';
  items.forEach(function(q){
    var card=el('section','card'); card.id='q'+q.ordinal;
    var label = q.number ? ('第 '+q.number+' 题') : ('第 '+q.ordinal+' 题');
    card.appendChild(el('div','qno',label));
    card.appendChild(el('div','stem',q.stem||''));

    var media=Array.isArray(q.media)?q.media:[];
    var stemMedia=media.filter(function(m){return m.slot==='stem'||m.slot==='figure';});
    var optMedia=media.filter(function(m){return m.slot==='option';});
    var shown=0;
    stemMedia.forEach(function(m){ var f=makeImg(m); if(f){ card.appendChild(f); shown++; } });
    // Placeholder rules: any displayable media -> show it. No media: figure_status
    // 'none' (confirmed no figure needed) -> nothing; 'missing', 'unknown', an absent
    // key, or 'ok' with no media (inconsistent data) -> grey 「图未入库」.
    if(shown===0 && optMedia.length===0 && q.figure_status!=='none'){ card.appendChild(el('div','noimg','图未入库')); }

    var opts=Array.isArray(q.options)?q.options:[];
    if(opts.length){
      var multi=q.qtype==='multi_choice';
      var used={};
      opts.forEach(function(o){
        var lab=el('label','opt'); var inp=document.createElement('input');
        inp.type=multi?'checkbox':'radio'; inp.name='r'+q.ordinal; inp.value=o.key;
        var cur=(answers[q.qref]||'').split(',');
        if(cur.indexOf(o.key)>=0){ inp.checked=true; lab.classList.add('sel'); }
        inp.onchange=function(){
          var picked=[]; card.querySelectorAll('input[name="r'+q.ordinal+'"]').forEach(function(x){
            x.parentNode.classList.toggle('sel',x.checked); if(x.checked) picked.push(x.value); });
          answers[q.qref]=picked.join(','); saveDraft();
        };
        lab.appendChild(inp); lab.appendChild(el('span','k',o.key+'.')); lab.appendChild(el('span','t',o.text||''));
        card.appendChild(lab);
        optMedia.forEach(function(m){ if(m.option_key===o.key){ var f=makeImg(m,'optfig'); if(f){ card.appendChild(f); used[m.url]=1; } } });
      });
      optMedia.forEach(function(m){ if(!used[m.url]){ var f=makeImg(m); if(f) card.appendChild(f); } });
    } else {
      optMedia.forEach(function(m){ var f=makeImg(m); if(f) card.appendChild(f); });
      var t=document.createElement('input'); t.type='text'; t.placeholder='填写答案'; t.autocomplete='off'; t.autocapitalize='off';
      t.value=answers[q.qref]||'';
      t.oninput=function(){ answers[q.qref]=t.value; saveDraft(); };
      card.appendChild(t);
    }
    root.appendChild(card);
  });
  updateProgress();
}

// ---- submit (same ntfy flow as the existing pages; topic comes from the server) --
function updateSubmitButton(){
  var b=$('btnSubmit');
  if(!ntfyUrl){ b.disabled=true; b.textContent='提交通道未配置'; }
  else { b.disabled=false; b.textContent='提交给爆米花'; }
}
function payload(){
  var n=0;
  var list=items.map(function(q){
    var typed=answers[q.qref]||''; if(typed.trim()!=='') n++;
    return {n:q.number||String(q.ordinal), ordinal:q.ordinal, qref:q.qref, typed:typed, correct:null};
  });
  return {
    type:'ruyi-mi-numberline-4y-submit',
    learner:'如意',
    day_key:DRAFT_KEY,
    submitted_at:new Date().toISOString(),
    set:{source:SOURCE},
    answers:list,
    answered:n+'/'+items.length,
    meta:{focus:'数轴月考（四年级）带图练习', site:location.href}
  };
}
function submit(){
  if(!ntfyUrl) return;
  var p=payload();
  var left=items.length-parseInt(p.answered,10);
  if(left>0 && !confirm('还有 '+left+' 题没写，确定现在提交吗？')) return;
  var b=$('btnSubmit'); b.disabled=true;
  var st=$('status'); st.innerHTML=''; var m=el('div','card soft','提交中…'); st.appendChild(m);
  var body=JSON.stringify(p);
  fetch(ntfyUrl,{method:'POST',headers:{'Title':'Ruyi MI Numberline 4Y Submit','Tags':'mailbox_with_mail,student','Content-Type':'text/plain; charset=utf-8'},body:body})
  .then(function(res){
    if(!res.ok) throw new Error('http '+res.status);
    try{ localStorage.setItem(DRAFT_KEY+'-last-submit', body); }catch(e){}
    m.className='card ok'; m.textContent='已提交！已答 '+p.answered+'。爆米花会收到，家长先看一眼再录入。';
  }).catch(function(e){
    m.className='card bad'; m.textContent='提交失败，请把答案复制发到聊天：'+(e&&e.message||e);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(JSON.stringify(p,null,2)).then(function(){ m.textContent+='（已复制到剪贴板）'; },function(){});
    }
  }).then(function(){ b.disabled=false; updateSubmitButton(); window.scrollTo({top:0,behavior:'smooth'}); });
}

// ---- wiring ----------------------------------------------------------------
$('gateForm').addEventListener('submit',function(ev){
  ev.preventDefault();
  var code=$('gateInput').value; if(!code.trim()) return;
  $('gateBtn').disabled=true; $('gateErr').textContent='';
  api('POST','/api/login',{code:code}).then(function(r){
    $('gateInput').value='';
    if(r.status===200){ hideGate(); load(); }
    else if(r.status===429){ $('gateErr').textContent='尝试次数太多，请一分钟后再试'; }
    else if(r.status===401){ $('gateErr').textContent='家庭码不对'; }
    else { $('gateErr').textContent='登录失败，请稍后再试'; }
  }).catch(function(){ $('gateErr').textContent='连不上练习站服务'; })
  .then(function(){ $('gateBtn').disabled=false; });
});
$('btnSubmit').onclick=submit;
$('btnClear').onclick=function(){
  if(!confirm('清空本页填写？')) return;
  answers={}; try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} render(); $('savedHint').textContent='';
};
$('btnLogout').onclick=function(){
  api('POST','/api/logout').then(function(){ items=[]; $('qs').innerHTML=''; $('countPill').textContent='已退出'; showGate(''); },function(){});
};
window.addEventListener('pagehide',saveDraftNow);
start();
})();
</script>
</body>
</html>
