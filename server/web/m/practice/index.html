<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>如意 · 练习</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css" />
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1917;--muted:#78716c;--accent:#0f766e;--accent-soft:#ccfbf1;--line:#d6d3d1;--warn:#b45309;--ok:#15803d;--bad:#b91c1c;--radius:16px;--shadow:0 8px 24px rgba(28,25,23,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:14px 14px 96px;font-size:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#d1fae5 0%,transparent 50%),radial-gradient(900px 500px at 100% 0%,#fde68a 0%,transparent 45%),var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:820px;margin:0 auto}
header,.card{background:var(--card);border-radius:var(--radius);padding:20px 20px;box-shadow:var(--shadow);margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 6px;line-height:1.35}
.meta{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#0f766e);transition:width .2s}
.qno{font-weight:700;color:var(--accent);margin:0 0 8px}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#f5f5f4;color:#57534e;font-size:.75rem;font-weight:600;vertical-align:middle}
.refpend{display:inline-block;margin:0 0 10px;padding:4px 10px;border-radius:8px;background:#fffbeb;color:#92400e;font-size:.85rem;font-weight:600}
.stem{word-break:break-word;margin:0 0 14px}
.stem p{margin:0 0 .7em}.stem p:last-child{margin-bottom:0}
.stem code,.opt code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f5f5f4;border-radius:6px;padding:1px 5px;font-size:.92em}
.tex.disp{display:block;margin:.5em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}
.tex.raw{font-family:ui-monospace,Menlo,Consolas,monospace;color:#57534e;background:#f5f5f4;border-radius:6px;padding:1px 5px;font-size:.92em}
.fig{margin:8px 0 14px}
.fig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.fig.optfig{margin:4px 0 4px 34px}
.noimg{display:flex;align-items:center;justify-content:center;min-height:84px;background:#e7e5e4;color:#57534e;border-radius:12px;font-size:.92rem;font-weight:600;margin:8px 0 14px;text-align:center;padding:8px}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0 0;background:#fafaf9;cursor:pointer}
.opt input{margin-top:.3em;width:22px;height:22px;flex:none}
.opt .k{font-weight:700;color:var(--accent);flex:none;min-width:1.3em}
.opt .t{word-break:break-word;min-width:0}
.opt.sel{border-color:var(--accent);background:#f0fdfa}
input.blank{display:inline-block;vertical-align:baseline;width:9em;max-width:100%;min-height:46px;margin:4px 6px;border:0;border-bottom:2.5px solid var(--accent);border-radius:8px 8px 0 0;padding:8px 12px;font-size:18px;font-family:inherit;background:#f0fdfa;color:var(--ink)}
input.blank:focus{outline:none;background:#e6fffa;border-bottom-color:#0b5d56}
textarea.ans{display:block;width:100%;min-height:9em;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:18px;line-height:1.6;font-family:inherit;background:#fafaf9;resize:vertical}
textarea.ans:focus,#gateInput:focus{outline:none;border-color:var(--accent);background:#fff}
.anslabel{font-size:.85rem;color:var(--muted);margin:10px 0 0}
#gateInput{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:18px;font-family:inherit;background:#fafaf9}
button{appearance:none;border:none;border-radius:999px;padding:12px 18px;min-height:46px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:#f5f5f4;color:var(--ink)}.btn-submit{background:#b45309;color:#fff}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.sticky button{flex:1;min-width:96px;max-width:220px}
.msg{margin-top:8px;font-size:.9rem}.bad{color:var(--bad)}.soft{color:var(--muted)}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px 16px;font-size:.95rem;color:#9a3412}
.notice button{margin-left:10px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#gate .box{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.08)}
#gate h2{margin:0 0 8px;font-size:1.2rem}
a{color:var(--accent)}
.submitcard{text-align:center}
.quota{margin:-2px 0 10px;font-size:.82rem;color:var(--muted)}.quota.zero{color:#b45309;font-weight:600}
.vd.cap{background:#fffbeb;color:#92400e}
.vd{margin-top:12px;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.95rem}
.vd.ok{background:#ecfdf5;color:#047857}.vd.wrong{background:#fef2f2;color:#b91c1c}.vd.pend{background:#fffbeb;color:#92400e}.vd.none{background:#f5f5f4;color:#57534e}
.qst{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#f5f5f4;color:#44403c;font-size:.92rem}
.qst .qst-l{font-weight:700}
.qst.ai_first_pass,.qst.reviewed{background:#eff6ff;color:#1e3a8a}
.qst.failed,.qst.expired,.qst.overdue_hint,.qst.not_queued,.qst.enqueue_retry{background:#fffbeb;color:#92400e}
.qst.purged,.qst.unknown{background:#f5f5f4;color:#57534e}
.qst .qst-c{margin-top:4px}
.aibox{margin-top:8px;padding:10px 12px;border:1.5px dashed #93c5fd;border-radius:10px;background:#fff;color:var(--ink)}
.aibox .ailabel{font-size:.78rem;font-weight:700;color:#1d4ed8;margin-bottom:4px}
.aibox .aians,.aibox .aiwhy{word-break:break-word;margin:4px 0 0}
.aibox .aik{font-weight:700;color:#57534e;font-size:.85rem}
.qbanner{margin:8px 0;padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:.95rem}
.qbanner.done{background:#ecfdf5;color:#047857}
.resbox h2{margin:0 0 6px;font-size:1.2rem}
.resbox .sum{font-size:1.05rem;margin:6px 0}
.resbox.done{border:2px solid #14b8a6}.resbox.soft2{border:2px solid #f59e0b}
.submitcard button{width:100%;max-width:340px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
.imgpick{margin-top:8px}.imgpick .imgbtn{display:inline-block;padding:8px 14px;border:1.5px dashed #94a3b8;border-radius:10px;cursor:pointer;color:#334155;font-size:.92rem}
.imgpick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.imgpick .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.imgpick .th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:#f1f5f9;font-size:.72rem;color:#475569;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all}
.imgpick .th img{width:100%;height:100%;object-fit:cover}
.imgpick .th button{position:absolute;min-width:0;min-height:0;max-width:none;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.imgpick .imsg{margin-top:6px;font-size:.88rem;color:#b91c1c}.imgpick .imsg.ok{color:#57534e}
@media (max-width:480px){body{padding:10px 10px 96px}header,.card{padding:16px 14px}input.blank{width:7.5em}}
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateForm" autocomplete="off">
    <h2>家庭专用</h2>
    <p class="meta" style="margin:0 0 12px">输入家庭码后才能查看练习。</p>
    <input id="gateInput" type="password" placeholder="家庭码" autocomplete="off" autocapitalize="off" aria-label="家庭码" />
    <button id="gateBtn" type="submit" class="btn-primary" style="margin-top:12px;width:100%">进入</button>
    <p id="gateErr" class="msg bad" style="min-height:1.3em"></p>
  </form>
</div>

<div class="wrap">
  <header>
    <h1><span id="title">练习</span><span class="pill" id="countPill">加载中</span></h1>
    <div class="meta">作答区在每题下方 · 草稿自动保存在本机</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta" id="savedHint" style="margin-top:8px"></div>
  </header>
  <div id="status"></div>
  <div id="qs"></div>
  <div class="card submitcard" id="submitCard" style="display:none">
    <div id="testBanner" class="notice" style="display:none;margin-bottom:12px;text-align:left">这是测试套：随便填，答案只留档、不会记入大脑；家长手机会收到一条「【测试】」提醒。</div>
    <button type="button" class="btn-ghost" id="btnCheck" style="display:none;margin-bottom:10px">检查</button>
    <button type="button" class="btn-submit" id="btnSubmit">提交</button>
    <p class="meta" style="margin:10px 0 0">没做的题可以先空着；提交前答案只保存在本机。</p>
    <p class="meta" style="margin:6px 0 0">每题每天最多提交 3 次（上海时间 0 点重新算）；题目上的「今天约还剩 N 次」按本站提交记录估算，仅供参考。</p>
    <div id="submitMsg" class="msg bad" role="status" aria-live="polite"></div>
  </div>
  <div class="card resbox" id="resultCard" style="display:none"></div>
  <p class="meta"><a href="/">每日一练</a></p>
  <footer>如意 · 练习站</footer>
</div>

<div class="sticky" id="actions" style="display:none">
  <button type="button" class="btn-ghost" id="btnClear">清空</button>
  <button type="button" class="btn-ghost" id="btnLogout">退出</button>
</div>

<script src="/vendor/katex/katex.min.js"></script>
<script>
(function(){
'use strict';
var SET_ID=null, DRAFT_KEY=null;
var $=function(id){return document.getElementById(id);};
var items=[], answers={}, saveTimer=null, isLocal=false;
var cid=null, cidSig=null, cidAt=null, result=null, submitting=false;
// "N left today": {day,limit,used:{qref:n}} from GET .../quota (this site's own
// archive of what the brain confirmed; an ESTIMATE, null = unknown -> no promise made)
var quota=null;
// The queue switch of the server (/api/config "queue":true, only present when it is on). It decides the wording:
// with the queue off nothing is ever "queued" and there is no AI first pass to promise.
var QUEUE_ON=false, NOTIFY_ON=false, cfgP=null;
// Answer images (/api/config "images", only present when the server has them on): {max_count,max_bytes,max_total_bytes}
var IMG_CFG=null, imgs={}, imgBusy=0;
function loadCfg(){
  if(!cfgP) cfgP=api('GET','/api/config').then(function(r){ if(r.status===200){ QUEUE_ON=!!(r.json && r.json.queue===true); NOTIFY_ON=QUEUE_ON && !!(r.json && r.json.notify===true); IMG_CFG=(QUEUE_ON && r.json && r.json.images && typeof r.json.images==='object')?r.json.images:null; } else cfgP=null; }).catch(function(){ cfgP=null; });
  return cfgP;
}
function capText(){ return QUEUE_ON?'今天这题已经交满 3 次，这次答案先存档，没有 AI 初评；明天再交一次才会排队。':'今天这题已经交满 3 次，这次答案先存档；明天再交一次才会记入大脑。'; }
var CAP_KEY='ruyi-practice-capped-v1';   // {"<day>|<qref>":1}: questions the brain itself refused today (daily_cap)
// optional ?kind=correction|variant is passed through as attempt_kind (nothing else reads it)
var KIND=(function(){var m=/[?&]kind=(correction|variant)(?:&|#|$)/.exec(location.search);return m?m[1]:null;})();
var UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function setStatus(text,retry){
  var s=$('status'); s.innerHTML='';
  if(!text) return;
  var d=el('div','card notice',text);
  if(retry){var b=el('button','btn-primary','重试');b.onclick=retry;d.appendChild(b);}
  s.appendChild(d);
}
function showGate(msg){
  $('gate').style.display='flex'; $('actions').style.display='none';
  $('gateErr').textContent=msg||''; $('gateInput').value=''; setTimeout(function(){$('gateInput').focus();},50);
}
function hideGate(){ $('gate').style.display='none'; }

// ---- api (the family code is only ever sent to /api/login, never stored) ------
function api(method,path,body){
  var opt={method:method,credentials:'same-origin',headers:{}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch(path,opt).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=JSON.parse(t); }catch(e){}
      return {status:r.status,json:j};
    });
  });
}

// ---- text: math tokenizer (twin of internal/practice/blanks.go Segments) ------
// Math: $$…$$  $…$  \(…\)  \[…\]. "\$" is a literal dollar; an opener with no
// closer is plain text; empty fragments are not math.
function segments(s){
  var out=[], plain='', i=0;
  function flush(){ if(plain){ out.push({t:plain}); plain=''; } }
  function closeInline(rest){
    for(var k=0;k<rest.length;k++){
      if(rest[k]==='\\'){ k++; continue; }
      if(rest[k]==='$') return k;
    }
    return -1;
  }
  while(i<s.length){
    var c=s[i];
    if(c==='\\' && i+1<s.length){
      var n=s[i+1];
      if(n==='$'){ plain+='\\$'; i+=2; continue; }
      if(n==='(' || n==='['){
        var close = n==='(' ? '\\)' : '\\]';
        var j=s.indexOf(close,i+2);
        if(j>i+2){ flush(); out.push({m:true,tex:s.slice(i+2,j),disp:n==='['}); i=j+2; continue; }
      }
      plain+=c+n; i+=2; continue;
    }
    if(c==='$'){
      if(s.substr(i,2)==='$$'){
        var j2=s.indexOf('$$',i+2);
        if(j2>i+2){ flush(); out.push({m:true,tex:s.slice(i+2,j2),disp:true}); i=j2+2; continue; }
        plain+='$$'; i+=2; continue;
      }
      var k=closeInline(s.slice(i+1));
      if(k>0){ flush(); out.push({m:true,tex:s.substr(i+1,k),disp:false}); i+=1+k+1; continue; }
    }
    plain+=c; i++;
  }
  flush();
  return out;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Minimal safe Markdown: HTML is escaped first; math is cut out before that and
// put back as empty .tex spans (filled in by katex afterwards); then
// `code`, **bold**, paragraphs and line breaks. Runs of >=4 underscores outside
// math become fill-in boxes (<input class="blank">).
// Returns {html, maths:[{tex,disp}], blanks:n}.
function renderMD(src,inline){
  src=String(src==null?'':src).replace(/[\uE000-\uE0FF]/g,'');
  var maths=[], codes=[], blanks=0, buf='';
  segments(src).forEach(function(sg){
    if(sg.m){ buf+='\uE001'+maths.length+'\uE002'; maths.push({tex:sg.tex,disp:sg.disp}); return; }
    var t=sg.t.replace(/\\\$/g,'$');
    var parts=t.split(/[_\uFF3F]{4,}/);
    var runs=t.match(/[_\uFF3F]{4,}/g)||[];
    parts.forEach(function(p,ix){ buf+=p; if(ix<runs.length){ buf+='\uE000'; } });
  });
  buf=esc(buf);
  buf=buf.replace(/`([^`\n]+)`/g,function(_,c){ codes.push(c); return '\uE003'+(codes.length-1)+'\uE004'; });
  buf=buf.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>');
  var html;
  if(inline){ html=buf.replace(/\r?\n/g,'<br>'); }
  else{
    html=buf.split(/\n{2,}/).map(function(p){ return '<p>'+p.replace(/\r?\n/g,'<br>')+'</p>'; }).join('');
  }
  html=html.replace(/\uE003(\d+)\uE004/g,function(_,i){ return '<code>'+codes[+i]+'</code>'; });
  html=html.replace(/\uE000/g,function(){
    var n=blanks++;
    return '<input type="text" class="blank" data-b="'+n+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="第 '+(n+1)+' 空">';
  });
  html=html.replace(/\uE001(\d+)\uE002/g,function(_,i){
    return '<span class="tex'+(maths[+i].disp?' disp':'')+'" data-k="'+i+'"></span>';
  });
  return {html:html,maths:maths,blanks:blanks};
}

// Fill the .tex spans with katex output; if katex is missing or rejects the
// formula, show the original text instead.
function typeset(root,maths){
  root.querySelectorAll('.tex[data-k]').forEach(function(sp){
    var m=maths[+sp.getAttribute('data-k')]; if(!m) return;
    var ok=false;
    if(typeof katex!=='undefined'){
      try{
        katex.render(m.tex,sp,{displayMode:!!m.disp,throwOnError:false,trust:false,strict:'ignore',output:'htmlAndMathml',maxExpand:1000});
        ok=!sp.querySelector('.katex-error');
      }catch(e){ ok=false; }
    }
    if(!ok){
      sp.textContent=(m.disp?'$$':'$')+m.tex+(m.disp?'$$':'$');
      sp.className='tex raw'+(m.disp?' disp':'');
    }
  });
}

function mdInto(node,src,inline){
  var r=renderMD(src,inline);
  node.innerHTML=r.html;
  typeset(node,r.maths);
  return r;
}

// ---- start ------------------------------------------------------------------
function parseSet(){
  var m=/[?&]set=([^&#]*)/.exec(location.search);
  if(!m) return null;
  var v; try{ v=decodeURIComponent(m[1]); }catch(e){ return null; }
  return /^[a-z0-9_-]{1,64}$/.test(v)?v:null;
}

function start(){
  setStatus('');
  SET_ID=parseSet();
  if(!SET_ID){
    $('countPill').textContent='缺少套号';
    setStatus('这个链接缺少练习套的编号，或编号不对。请从家长发的链接进入（形如 /m/practice/?set=……）。');
    return;
  }
  DRAFT_KEY='ruyi-practice-'+SET_ID+'-v1';
  api('GET','/api/session').then(function(r){
    if(r.status!==200 || !r.json || typeof r.json.authenticated!=='boolean'){
      $('countPill').textContent='不可用';
      setStatus('这个页面需要在家庭练习站（带服务端的地址）打开。');
      return;
    }
    if(!r.json.authenticated){ showGate(''); return; }
    hideGate(); load();
  }).catch(function(){
    $('countPill').textContent='离线';
    setStatus('连不上练习站服务，请检查网络后重试。',start);
  });
}

function load(note){ loadCfg().then(function(){ load0(note); }); }
function load0(note){
  $('countPill').textContent='加载中';
  setStatus('');
  api('GET','/api/practice/'+SET_ID).then(function(r){
    if(r.status===401){ showGate('登录已过期，请重新输入家庭码'); return; }
    if(r.status===404 || r.status===400){
      $('countPill').textContent='没有这套题';
      setStatus(/^auto-/.test(SET_ID)?'这套临时练习已经过期了。请回到出题的地方重新出一套。':'没有找到这套练习。请确认链接是否正确，或问问家长。');
      $('qs').innerHTML=''; $('actions').style.display='none'; $('submitCard').style.display='none'; $('resultCard').style.display='none';
      return;
    }
    if(r.status!==200 || !r.json || !Array.isArray(r.json.items)){
      $('countPill').textContent='题库不可用';
      setStatus(((r.json&&r.json.message)||'题库暂时连不上')+'。稍后点「重试」。',function(){load();});
      $('qs').innerHTML=''; $('actions').style.display='none'; $('submitCard').style.display='none'; $('resultCard').style.display='none';
      return;
    }
    items=r.json.items;
    isLocal=r.json.local===true;
    $('testBanner').style.display=isLocal?'block':'none';
    $('btnCheck').style.display=isLocal?'inline-block':'none';
    $('title').textContent=r.json.title||'练习';
    document.title=(r.json.title||'练习')+' · 如意';
    var miss=Array.isArray(r.json.missing_qrefs)?r.json.missing_qrefs.length:0;
    if(miss>0) setStatus('有 '+miss+' 道题暂时没取到，已先跳过；请告诉家长。');
    loadDraft();
    render();
    fetchQuota();
    $('actions').style.display='flex';
    showSubmitArea();
    if(typeof note==='string' && note) submitMsg(note);
  }).catch(function(){
    $('countPill').textContent='离线';
    setStatus('连不上练习站服务，请检查网络后重试。',function(){load();});
  });
}

// ---- draft (never contains the family code) ---------------------------------
function loadDraft(){
  answers={}; imgs={}; cid=null; cidSig=null; cidAt=null; result=null;
  try{
    var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');
    if(d && d.a && typeof d.a==='object'){
      items.forEach(function(q){ if(Object.prototype.hasOwnProperty.call(d.a,q.qref)) answers[q.qref]=d.a[q.qref]; });
    }
    if(d && d.im && typeof d.im==='object'){   // uploaded images: sha + size + name only (no preview after a reload)
      items.forEach(function(q){ var l=d.im[q.qref]; if(Array.isArray(l)) imgs[q.qref]=l.filter(function(x){ return x && /^[0-9a-f]{64}$/.test(x.sha) && x.bytes>0; }).map(function(x){ return {sha:x.sha,bytes:+x.bytes,name:String(x.name||'图片').slice(0,40)}; }); });
    }
    if(d && typeof d.cid==='string' && UUID_RE.test(d.cid)){
      cid=d.cid; cidSig=typeof d.sig==='string'?d.sig:null; cidAt=typeof d.at==='string'?d.at:null;
      var r=d.res;
      if(r && typeof r==='object' && r.client_attempt_id===cid && r.set_id===SET_ID && Array.isArray(r.results) && r.summary && typeof r.summary==='object') result=r;
    }
  }catch(e){}
}
function saveDraftNow(){
  if(!DRAFT_KEY) return;
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({v:1,set:SET_ID,a:answers,im:imgsForDraft(),t:new Date().toISOString(),cid:cid,sig:cidSig,at:cidAt,res:result}));
    $('savedHint').textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){}
  updateProgress();
}
function imgsForDraft(){
  var o={}; Object.keys(imgs).forEach(function(k){ if(imgs[k].length) o[k]=imgs[k].map(function(x){ return {sha:x.sha,bytes:x.bytes,name:x.name}; }); }); return o;
}
// ---- answer images: pick 1..6 local images per free-text question (no camera entry: no capture attribute) ----
// Each picked image is decoded and re-encoded in the browser (long edge ≤ 2560, EXIF incl. GPS dropped),
// then uploaded at once to /api/practice/{set}/images; the answer carries only the sha256s.
var IMG_LONG=2560, IMG_RAW_MAX=30*1024*1024;
function fmtMB(n){ return (n/1048576).toFixed(1)+'MB'; }
function imgTotal(ref){ return (imgs[ref]||[]).reduce(function(a,x){ return a+x.bytes; },0); }
function prepImage(file){
  return new Promise(function(res,rej){
    var t=(file.type||'').toLowerCase();
    if(t!=='image/jpeg' && t!=='image/png' && t!=='image/jpg') return rej('只支持 JPG 或 PNG 图片（「'+file.name+'」不是）。');
    if(file.size>IMG_RAW_MAX) return rej('「'+file.name+'」太大了（'+fmtMB(file.size)+'），每张不能超过 '+fmtMB(IMG_CFG.max_bytes)+'。');
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var w=im.naturalWidth, h=im.naturalHeight, k=Math.min(1,IMG_LONG/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      var png=t==='image/png' && file.size<=IMG_CFG.max_bytes && k===1;
      c.toBlob(function(b){
        if(!b) return rej('「'+file.name+'」处理失败，请换一张。');
        if(b.size>IMG_CFG.max_bytes) return rej('「'+file.name+'」压缩后仍超过 '+fmtMB(IMG_CFG.max_bytes)+'，请换一张。');
        res(b);
      }, png?'image/png':'image/jpeg', 0.85);
    };
    im.onerror=function(){ URL.revokeObjectURL(url); rej('「'+file.name+'」打不开，请换一张 JPG 或 PNG 图片。'); };
    im.src=url;
  });
}
function uploadBlob(b){
  return fetch('/api/practice/'+SET_ID+'/images',{method:'POST',credentials:'same-origin',headers:{'Content-Type':b.type},body:b}).then(function(r){
    return r.text().then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} return {status:r.status,json:j}; });
  });
}
function imgPicker(q){
  var box=el('div','imgpick'); var id='f'+q.ordinal;
  var lab=el('label','imgbtn','＋ 选图片（JPG/PNG，最多 '+IMG_CFG.max_count+' 张）'); lab.htmlFor=id;
  var inp=document.createElement('input'); inp.type='file'; inp.id=id; inp.accept='image/jpeg,image/png'; inp.multiple=true;
  inp.setAttribute('aria-label','第 '+q.ordinal+' 题选图片');
  var th=el('div','thumbs'), msg=el('div','imsg');
  function paint(){
    th.innerHTML='';
    (imgs[q.qref]||[]).forEach(function(x,i){
      var d=el('div','th'); if(x.url){ var im=document.createElement('img'); im.src=x.url; im.alt=x.name; d.appendChild(im); } else d.textContent=x.name;
      var rm=document.createElement('button'); rm.type='button'; rm.className='imgrm'; rm.textContent='×'; rm.setAttribute('aria-label','删掉这张');
      rm.onclick=function(){ imgs[q.qref].splice(i,1); paint(); saveDraft(); };
      d.appendChild(rm); th.appendChild(d);
    });
  }
  function say(t,ok){ msg.textContent=t||''; msg.className='imsg'+(ok?' ok':''); }
  inp.onchange=function(){
    var files=Array.prototype.slice.call(inp.files||[]); inp.value='';
    if(!files.length) return;
    var have=(imgs[q.qref]||[]).length;
    if(have+files.length>IMG_CFG.max_count){ say('每题最多 '+IMG_CFG.max_count+' 张图片，现在已有 '+have+' 张。'); return; }
    imgs[q.qref]=imgs[q.qref]||[]; imgBusy++; say('图片上传中…',true);
    var errs=[];
    files.reduce(function(p,f){
      return p.then(function(){ return prepImage(f); }).then(function(b){
        if(imgTotal(q.qref)+b.size>IMG_CFG.max_total_bytes) throw '这题图片加起来不能超过 '+fmtMB(IMG_CFG.max_total_bytes)+'（「'+f.name+'」没加上）。';
        return uploadBlob(b).then(function(r){
          if(r.status===200 && r.json && /^[0-9a-f]{64}$/.test(r.json.sha256)){
            if(!imgs[q.qref].some(function(x){ return x.sha===r.json.sha256; }))
              imgs[q.qref].push({sha:r.json.sha256,bytes:+r.json.bytes||b.size,name:f.name.slice(0,40),url:URL.createObjectURL(b)});
            paint(); saveDraftNow(); return;
          }
          // judged by HTTP status only (an nginx 413/502 page has no JSON body)
          var byStatus={401:'登录已过期，请刷新页面重新输入家庭码。',413:'图片太大了：每张不能超过 5MB。',415:'只支持 JPG 或 PNG 图片。',422:'这张图片打不开或尺寸太大，请换一张。',429:'今天上传的图片已经到上限了，明天再传。',409:'图片存储空间已满，请告诉家长。',503:'上传的人有点多，请过几秒再试。'};
          if(r.status===401) throw byStatus[401];
          throw (byStatus[r.status]||'图片暂时传不上去，请稍后再试。')+'（「'+f.name+'」）';
        }, function(){ throw '连不上练习站服务，「'+f.name+'」没传上去。'; });
      }).catch(function(e){ errs.push(typeof e==='string'?e:'「'+f.name+'」没传上去。'); });
    }, Promise.resolve()).then(function(){ imgBusy--; say(errs.join(' ')); });
  };
  box.appendChild(lab); box.appendChild(inp); box.appendChild(th); box.appendChild(msg); paint();
  return box;
}
function saveDraft(){
  document.querySelectorAll('#qs .vd.chk').forEach(function(n){ n.remove(); });   // an old 「检查」 verdict is stale once the answer changes
  clearTimeout(saveTimer); saveTimer=setTimeout(saveDraftNow,250);
}
function filled(q){
  var v=answers[q.qref];
  if(Array.isArray(v)) return v.some(function(x){ return typeof x==='string' && x.trim()!==''; });
  return typeof v==='string' && v.trim()!=='';
}
function updateProgress(){
  var n=0; items.forEach(function(q){ if(filled(q)) n++; });
  $('bar').style.width=items.length?Math.round(n/items.length*100)+'%':'0';
  $('countPill').textContent='已答 '+n+' / '+items.length;
}

// ---- render ------------------------------------------------------------------
function safeSrc(u){ return typeof u==='string' && u.indexOf('/api/media/')===0 && u.indexOf('..')<0 && u.indexOf('?')<0 ? u : null; }

function makeImg(m,cls){
  var src=safeSrc(m.url); if(!src) return null;
  var wrap=el('div','fig '+(cls||''));
  var img=document.createElement('img');
  img.loading='lazy'; img.decoding='async'; img.alt=m.alt||'题目配图'; img.src=src;

    var b=el('button','btn-ghost','重试'); b.style.marginLeft='10px';
    b.onclick=function(){ box.replaceWith(wrap); img.src=src+'?r='+Date.now().toString(36); };
    box.appendChild(b); wrap.replaceWith(box);
  };
  wrap.appendChild(img);
  return wrap;

function render(){
  var root=$('qs'); root.innerHTML='';
  items.forEach(function(q){
    var card=el('section','card'); card.id='q'+q.ordinal; card.setAttribute('data-qref',q.qref);
    card.appendChild(el('div','qno','第 '+q.ordinal+' 题'));

    var media=Array.isArray(q.media)?q.media:[];

    var opts=Array.isArray(q.options)?q.options:[];

        var lab=el('label','opt'); var inp=document.createElement('input');
        inp.type=multi?'checkbox':'radio'; inp.name='r'+q.ordinal; inp.value=o.key;
        var cur=(typeof answers[q.qref]==='string'?answers[q.qref]:'').split(',');
        if(cur.indexOf(o.key)>=0){ inp.checked=true; lab.classList.add('sel'); }
        inp.onchange=function(){
          var picked=[]; card.querySelectorAll('input[name="r'+q.ordinal+'"]').forEach(function(x){
            x.parentNode.classList.toggle('sel',x.checked); if(x.checked) picked.push(x.value); });
          answers[q.qref]=picked.join(','); saveDraft();
        };
        lab.appendChild(inp); lab.appendChild(el('span','k',o.key+'.'));
        var t=el('span','t'); mdInto(t,o.text_md||'',true); lab.appendChild(t);
        card.appendChild(lab);
        optMedia.forEach(function(m){ if(m.option_key===o.key){ var f=makeImg(m,'optfig'); if(f){ card.appendChild(f); used[m.url]=1; } } });
      });
      optMedia.forEach(function(m){ if(!used[m.url]){ var f=makeImg(m); if(f) card.appendChild(f); } });
    } else {
      optMedia.forEach(function(m){ var f=makeImg(m); if(f) card.appendChild(f); });
      if(r.blanks>0){
        var saved=Array.isArray(answers[q.qref])?answers[q.qref]:[];
        var vals=[]; for(var i=0;i<r.blanks;i++) vals.push(typeof saved[i]==='string'?saved[i]:'');
        stem.querySelectorAll('input.blank').forEach(function(inp){
          var idx=+inp.getAttribute('data-b');
          inp.value=vals[idx]||'';
          inp.oninput=function(){ vals[idx]=inp.value; answers[q.qref]=vals.slice(); saveDraft(); };
        });
      } else {
        card.appendChild(el('div','anslabel','作答区（过程和答案都可以写在这里）'));
        var ta=document.createElement('textarea'); ta.className='ans'; ta.rows=5; ta.setAttribute('aria-label','第 '+q.ordinal+' 题作答区');
        ta.autocapitalize='off'; ta.spellcheck=false;
        ta.value=typeof answers[q.qref]==='string'?answers[q.qref]:'';
        ta.oninput=function(){ answers[q.qref]=ta.value; saveDraft(); };
        card.appendChild(ta);
        if(IMG_CFG && !isLocal) card.appendChild(imgPicker(q));
      }
    }
    root.appendChild(card);
  });
  updateProgress();
  applyResult();
  paintQuota();
}

// ---- daily limit: "今天约还剩 N 次" (estimate) + confirm before submitting -------------
function cappedMap(){
  try{ var m=JSON.parse(localStorage.getItem(CAP_KEY)||'{}'); return (m&&typeof m==='object')?m:{}; }catch(e){ return {}; }
}
function rememberCapped(day,refs){
  if(!day||!refs.length) return;
  var m=cappedMap(), out={};
  Object.keys(m).forEach(function(k){ if(k.indexOf(day+'|')===0) out[k]=1; });   // only today's survive
  refs.forEach(function(r){ out[day+'|'+r]=1; });
  try{ localStorage.setItem(CAP_KEY,JSON.stringify(out)); }catch(e){}
}
// used-so-far for a question, or null when unknown. The brain's own refusal wins over the estimate.
function usedToday(ref){
  if(!quota || isLocal) return null;
  var lim=quota.limit||3, u=quota.used&&typeof quota.used[ref]==='number'?quota.used[ref]:null;
  if(cappedMap()[quota.day+'|'+ref]) return lim;
  return u;
}
function paintQuota(){
  document.querySelectorAll('#qs .quota').forEach(function(n){ n.remove(); });
  if(!quota || isLocal) return;
  var lim=quota.limit||3;
  document.querySelectorAll('#qs section[data-qref]').forEach(function(card){
    var u=usedToday(card.getAttribute('data-qref')); if(u===null) return;
    var left=Math.max(0,lim-u);
    var d=el('div','quota'+(left===0?' zero':''),left===0?(QUEUE_ON?'今天这题已交满 3 次，再交只存档、没有 AI 初评；明天再交一次才会排队。':'今天这题已交满 3 次，再交只存档；明天再交一次才会记入大脑。'):'今天约还剩 '+left+' 次');
    d.setAttribute('data-left',String(left));
    d.title='按本站提交记录估算（不含别处的提交），仅供参考';
    var q=card.querySelector('.qno'); if(q&&q.nextSibling) card.insertBefore(d,q.nextSibling); else card.appendChild(d);
  });
}
function fetchQuota(){
  if(!SET_ID || isLocal) return Promise.resolve();
  return api('GET','/api/practice/'+SET_ID+'/quota').then(function(r){
    var j=r.json;
    if(r.status===200 && j && typeof j.day==='string' && typeof j.limit==='number' && j.used && typeof j.used==='object' && j.local!==true){ quota=j; }
    else quota=null;
    paintQuota();
  }).catch(function(){ quota=null; paintQuota(); });
}
// Asked before every real submission. Sends/stores nothing: cancelling keeps
// the draft and the answers exactly as they were.
function confirmText(list){
  var lim=(quota&&quota.limit)||3, minLeft=null, full=[], unknown=0;
  var ord={}; items.forEach(function(q){ ord[q.qref]=q.ordinal; });
  list.forEach(function(a){
    var u=usedToday(a.qref);
    if(u===null){ unknown++; return; }
    if(u>=lim) full.push('第 '+ord[a.qref]+' 题');
    var left=Math.max(0,lim-u-1);
    if(minLeft===null||left<minLeft) minLeft=left;
  });
  var t;
  if(minLeft===null) t='每题每天只能提交'+lim+'次（今天还剩几次暂时查不到）。';
  else if(list.length===1) t='每题每天只能提交'+lim+'次，本次提交后约还剩'+minLeft+'次。';
  else t='每题每天只能提交'+lim+'次，本次提交 '+list.length+' 道题，提交后剩余次数最少的一题约还剩'+minLeft+'次。';
  if(minLeft!==null) t+='（按本站提交记录估算'+(unknown?'；有 '+unknown+' 题查不到次数':'')+'）';
  if(full.length) t+='\n\n注意：'+full.join('、')+'今天的 '+lim+' 次已经用完，'+(QUEUE_ON?'这几题这次只会先存档，没有 AI 初评、不会记入大脑；其中能直接判分的题满了，大脑还会把同批的其他题一起退回，也只存档。想记入大脑的话，先取消，把这几题清空再提交。':'大脑会拒收整批，这次只会留档、不会记入大脑。想记入大脑的话，先取消，把这几题清空再提交。');
  return t+'\n\n确定提交吗？';
}
function markCapped(j){
  document.querySelectorAll('#qs .vd.cap').forEach(function(n){ n.remove(); });
  (Array.isArray(j.results)?j.results:[]).forEach(function(x){
    if(!x||x.capped!==true) return;
    var card=document.querySelector('#qs section[data-qref="'+String(x.qref).replace(/"/g,'')+'"]'); if(!card) return;
    card.appendChild(el('div','vd cap',capText()));
  });
}

// ---- submit / result ---------------------------------------------------------
function newCid(){
  try{ if(window.crypto && typeof crypto.randomUUID==='function') return crypto.randomUUID(); }catch(e){}
  var b=new Uint8Array(16);
  try{ crypto.getRandomValues(b); }catch(e){ for(var i=0;i<16;i++) b[i]=Math.floor(Math.random()*256); }
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  var h=Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
// What goes to the server: only questions that have an answer. Multiple choice
// is stored as "A,B" in the draft but sent as a sorted array of keys.
function payloadAnswers(){
  var list=[];
  items.forEach(function(q){
    if(!filled(q)) return;
    var v=answers[q.qref], a;
    if(Array.isArray(q.options) && q.options.length){
      var keys=(typeof v==='string'?v:'').split(',').filter(function(k){return k!=='';});
      a=q.qtype==='multi_choice'?keys.sort():keys[0];
    } else if(Array.isArray(v)){
      a=v.map(function(x){return typeof x==='string'?x:'';});
    } else a=v;
    var it={qref:q.qref,answer:a};
    if(typeof q.rev==='number' && q.rev>0) it.rev=q.rev;
    if(IMG_CFG && imgs[q.qref] && imgs[q.qref].length) it.images=imgs[q.qref].map(function(x){ return x.sha; });
    list.push(it);
  });
  return list;
}
function submitMsg(t){ $('submitMsg').textContent=t||''; }
function showSubmitArea(){
  if(!result && !submitting){ var b=$('btnSubmit'); b.disabled=false; b.textContent='提交'; }
  $('submitCard').style.display=result?'none':'block';
  $('resultCard').style.display=result?'block':'none';
}
function setLocked(on){
  document.querySelectorAll('#qs input,#qs textarea,#qs .imgrm').forEach(function(x){ x.disabled=!!on; });
  document.querySelectorAll('#qs .imgpick .imgbtn').forEach(function(x){ x.style.display=on?'none':''; });
}
// 「已提交到大脑」 only when the brain itself confirmed it recorded the answers
// (brain_recorded + per-question recorded:true). Anything else is worded as
// archive-only / pending / not auto-graded, never as recorded in the brain.
function brainConfirmed(r){ return !!r && r.mode==='graded' && r.brain_recorded===true; }
function applyResult(noStart){
  document.querySelectorAll('#qs .vd,#qs .qst').forEach(function(n){ n.remove(); });
  var box=$('resultCard'); box.innerHTML='';
  if(!result){ qStop(); setLocked(false); showSubmitArea(); return; }
  var qOK={}, qCap={}, qWait={}, qExh={}, qRetry=false; if(result.queue && Array.isArray(result.queue.items)) result.queue.items.forEach(function(x){ if(!x) return; if(x.enq==='ok') qOK[x.qref]=1; if(x.enq==='failed'){ qRetry=true; qWait[x.qref]=1; } if(x.enq==='not_queued' && x.reason==='daily_cap') qCap[x.qref]=1; if(x.enq==='not_queued' && x.reason==='retry_exhausted') qExh[x.qref]=1; });
  var confirmed=brainConfirmed(result), qon=QUEUE_ON||!!result.queue, anyExh=Object.keys(qExh).length>0;
  var byRef={}; result.results.forEach(function(r){ if(r && typeof r.qref==='string') byRef[r.qref]=r; });
  document.querySelectorAll('#qs section[data-qref]').forEach(function(card){
    var r=byRef[card.getAttribute('data-qref')]; if(!r) return;
    var cls='pend', txt='待核对';
    if(r.status==='unanswered'){ cls='none'; txt='未作答'; }
    else if(r.status==='unsupported'){ cls='none'; txt=(r.recorded===true||qOK[r.qref])?'不自动判分':(qExh[r.qref]?'暂时没能排队，答案已存档':qWait[r.qref]?'答案已存档，正在排队':(qCap[r.qref]?'今天已交满 3 次，先存档':'不自动判分（不入大脑）')); }
    else if(confirmed && r.recorded===true && r.status==='graded' && typeof r.correct==='boolean'){
      if(r.correct){ cls='ok'; txt='✓ 答对了'; } else { cls='wrong'; txt='✗ 不对'; }
    }
    else if(result.test===true && r.recorded!==true && r.status==='graded' && typeof r.correct==='boolean'){
      // local test set: judged by the server, never recorded in the brain
      if(r.correct){ cls='ok'; txt='✓ 答对了（测试）'; } else { cls='wrong'; txt='✗ 不对（测试）'; }
    }
    if(cls==='pend' && r.recorded!==true && !qOK[r.qref]){ if(qCap[r.qref]) txt='今天已交满 3 次，先存档'; else if(qExh[r.qref]) txt='暂时没能排队，答案已存档'; else if(qWait[r.qref]) txt+='（答案已存档，正在排队）'; else txt+='（不入大脑）'; }   // only an answer the brain confirmed recorded is "in the brain"
    card.appendChild(el('div','vd '+cls,txt));
  });
  var sm=result.summary||{};
  var total=+sm.total||0, un=+sm.unanswered||0, uns=+sm.unsupported||0, asked=total-un;
  var rc=+result.recorded_count||0;
  box.className='card resbox '+(confirmed?'done':'soft2');
  if(confirmed){
    box.appendChild(el('h2',null,rc>=asked?'已提交到大脑':'已提交到大脑（'+rc+' / '+asked+' 题）'));
    box.appendChild(el('div','sum','共 '+total+' 题 · 答对 '+(+sm.correct||0)+' · 答错 '+Math.max(0,(+sm.graded||0)-(+sm.correct||0))+' · 待核对 '+(+sm.pending||0)+(uns>0?' · 不自动判分 '+uns:'')+' · 未作答 '+un));
    if((+sm.pending||0)>0) box.appendChild(el('p','meta','「待核对」是这道题暂时没有判分（参考答案还在核对），不是做错了。'));
    if(rc<asked) box.appendChild(el('p','meta','有 '+(asked-rc)+' 道题不能自动判分，'+(qRetry?'答案已经存档，正在排队等 AI 初评。':(anyExh?'暂时没能排队，答案已存档。':(qon?'这次答案先存档，没有 AI 初评。':'这次答案先存档。')))));
  } else if(result.test===true){
    box.appendChild(el('h2',null,'已提交（仅留档，未记入大脑）'));
    box.appendChild(el('div','sum','测试套 · 共 '+total+' 题 · 已作答 '+asked+' · 答对 '+(+sm.correct||0)+' · 未作答 '+un));
    box.appendChild(el('p','meta','这是测试，答案只存在练习站的存档里，家长会收到一条「【测试】」提醒。'));
    if(result.archived===false) box.appendChild(el('p','msg bad','这次提交没能保存下来，请告诉家长。'));
  } else if(result.mode==='graded'){
    box.appendChild(el('h2',null,'已提交（答案先存档）'));
    box.appendChild(el('div','sum','共 '+total+' 题 · 已作答 '+asked+' · 未作答 '+un));
    box.appendChild(el('p','meta',(qRetry?'这些题的答案已经存档，正在排队等 AI 初评，现在不显示对错。':(anyExh?'这些题暂时没能排队，答案已存档，现在不显示对错。':qon?'这些题这次没有判分，答案先存档，没有 AI 初评，现在不显示对错。':'这些题这次没有判分，答案先存档，现在不显示对错。'))));
    if(result.archived===false) box.appendChild(el('p','msg bad','这次提交没能保存下来，请告诉家长。'));
  } else {
    box.appendChild(el('h2',null,'已提交（暂未判分）'));
    box.appendChild(el('div','sum','共 '+total+' 题 · 已作答 '+asked+' · 未作答 '+un));
    box.appendChild(el('p','meta',result.brain_note==='not_ready'?'大脑接口还没准备好，答案先存档，现在不显示对错。':'答案先存档，现在不显示对错。'));
    if(result.archived===false) box.appendChild(el('p','msg bad','这次提交没能保存下来，请告诉家长。'));
  }
  if(Array.isArray(result.images_not_sent) && result.images_not_sent.length){
    var nos=items.filter(function(q){ return result.images_not_sent.indexOf(q.qref)>=0; }).map(function(q){ return q.ordinal; });
    box.appendChild(el('p','meta','第 '+nos.join('、')+' 题的图片这次没有交给大脑（这题已自动判分或还在排队），文字答案已提交。'));
  }
  if(result.replayed) box.appendChild(el('p','meta','这份提交之前已经收到过，下面是当时的结果。'));
  var again=el('button','btn-primary','再做一次'); again.type='button'; again.id='btnAgain'; again.style.marginTop='10px';
  again.onclick=resetAll;
  box.appendChild(again);
  setLocked(true); showSubmitArea();
  if(!noStart) qStart();
}

// ---- S1: AI first-pass status of queued answers ------------------------------------
// result.queue (from the grade reply) says which answers were queued; GET
// /api/practice/attempts/<cid>/queue is a pure read (it never queues anything) with the
// per-answer status. Polling: every 15 s for the first 5 minutes, then every 60 s; only
// while something is still pending and the tab is visible. When the grade reply or the
// status says an enqueue is still being retried the page asks ONCE for an immediate
// retry (POST .../enqueue; there is no manual button). AI text is only ever shown as
// "AI初评·待家长核", through the same escaping markdown renderer as the questions.
var Q={timer:null,t0:0,cid:null,busy:false,posted:false,gen:0,last:null};
var Q_FAST=15000, Q_SLOW=60000, Q_SWITCH=300000;
function qDelay(elapsed){ return elapsed<Q_SWITCH?Q_FAST:Q_SLOW; }
window.__ruyiQ={delay:qDelay,state:function(){ return {cid:Q.cid,active:!!Q.timer,posts:Q.posted?1:0}; }};
function qStop(){ Q.gen++; if(Q.timer){ clearTimeout(Q.timer); Q.timer=null; } Q.cid=null; Q.last=null; Q.posted=false; }
function qSeed(){
  var rq=result&&result.queue; if(!rq||!Array.isArray(rq.items)) return null;
  var items=rq.items.map(function(x){
    var ui=x.enq==='ok'?'waiting':(x.enq==='failed'?'enqueue_retry':'not_queued');
    var label=x.enq==='ok'?'已排队，等 AI 判卷':(x.enq==='failed'?'已提交，正在排队（会自动重试）':(x.reason==='daily_cap'?'今天这题已经交满 3 次，这次答案先存档，没有 AI 初评；明天再交一次才会排队。':(x.reason==='retry_exhausted'?'暂时没能排队，答案已存档':'未排队：答案已存档，没有 AI 初评')));
    return {qref:x.qref,ui_state:ui,label:label};
  });
  return {items:items,summary:{any_pending:items.some(function(i){return i.ui_state!=='not_queued';})}};
}
function qPaint(view){
  if(!view||!Array.isArray(view.items)) return;
  Q.last=view;
  var byRef={}; view.items.forEach(function(i){ if(i&&typeof i.qref==='string') byRef[i.qref]=i; });
  document.querySelectorAll('#qs section[data-qref]').forEach(function(card){
    var old=card.querySelector('.qst'); if(old) old.remove();
    var it=byRef[card.getAttribute('data-qref')]; if(!it) return;
    var ui=/^[a-z_]{1,20}$/.test(it.ui_state||'')?it.ui_state:'unknown';
    var box=el('div','qst '+ui); box.setAttribute('data-ui',ui);
    box.appendChild(el('div','qst-l',typeof it.label==='string'?it.label:'状态更新中'));
    if(it.compare_text) box.appendChild(el('div','qst-c',it.compare_text));
    if(it.result && (it.result.proposed_answer||it.result.rationale) && (ui==='ai_first_pass'||ui==='reviewed')){
      var ai=el('div','aibox'); ai.appendChild(el('div','ailabel','AI初评·待家长核（AI 可能出错，以家长核对为准）'));
      if(it.result.proposed_answer){ var a=el('div','aians'); a.appendChild(el('span','aik','AI 的答案：')); var as=el('span'); a.appendChild(as); ai.appendChild(a); mdInto(as,String(it.result.proposed_answer),true); }
      if(it.result.rationale){ var w=el('div','aiwhy'); w.appendChild(el('span','aik','AI 的解析：')); var ws=el('div'); w.appendChild(ws); ai.appendChild(w); mdInto(ws,String(it.result.rationale),false); }
      box.appendChild(ai);
    }
    card.appendChild(box);
  });
  var b=$('qBanner'); if(!b){ b=el('div','qbanner'); b.id='qBanner'; b.setAttribute('role','status'); var box=$('resultCard'); box.insertBefore(b,box.querySelector('#btnAgain')); }
  var sm=view.summary||{}, parts=[];
  if(+sm.ai_first_pass>0) parts.push('AI 初评已出 '+(+sm.ai_first_pass)+' 题（待家长核）');
  if(+sm.reviewed>0) parts.push('家长已核 '+(+sm.reviewed)+' 题');
  var wait=(+sm.waiting||0)+(+sm.ai_working||0)+(+sm.enqueue_retry||0)+(+sm.unknown||0);
  if(wait>0) parts.push('还在等 '+wait+' 题');
  if(+sm.manual>0) parts.push((+sm.manual)+' 题转人工');
  if(+sm.purged>0) parts.push((+sm.purged)+' 题的解析已被家长删除');
  if(+sm.not_queued>0) parts.push((+sm.not_queued)+' 题未排队（答案已存档）');
  b.className='qbanner'+(sm.any_pending?'':' done');
  b.textContent=parts.length?parts.join(' · ')+(sm.any_pending?('。可以关掉页面，'+(NOTIFY_ON?'AI 初评出来后家长手机会收到提醒。':'稍后回来看。')):'。'):'';
  if(view.stale) b.textContent+=' （状态更新慢，稍后自动刷新）';
}
// The result kept from an earlier visit may say an enqueue was still being retried while the status
// API already knows better (given up, or queued after all): the status wins, rows and paragraph follow.
function qReconcile(view){
  if(!result || !result.queue || !Array.isArray(result.queue.items)) return false;
  var m={}; view.items.forEach(function(i){ if(i && typeof i.qref==='string') m[i.qref]=i; });
  var ch=false;
  result.queue.items.forEach(function(x){
    var v=x&&m[x.qref]; if(!v||x.enq!=='failed') return;
    if(v.ui_state==='not_queued'){ x.enq='not_queued'; x.reason=typeof v.reason==='string'?v.reason:''; ch=true; }
    else if(v.ui_state && v.ui_state!=='enqueue_retry'){ x.enq='ok'; ch=true; }
  });
  return ch;
}
function qPending(view){ return !view || !view.summary || view.summary.any_pending!==false; }
function qFetch(gen){
  if(gen!==Q.gen || !Q.cid) return Promise.resolve();
  var c=Q.cid;
  return api('GET','/api/practice/attempts/'+encodeURIComponent(c)+'/queue').then(function(r){
    if(gen!==Q.gen) return;
    if(r.status===200 && r.json && Array.isArray(r.json.items)){
      if(qReconcile(r.json)){ applyResult(true); }   // an old result (reopened page) is redrawn with what the status says now
      qPaint(r.json);
      var retrying=r.json.items.some(function(i){return i.ui_state==='enqueue_retry';});
      if(retrying && !Q.posted){ Q.posted=true; return api('POST','/api/practice/attempts/'+encodeURIComponent(c)+'/enqueue',{}).then(function(){ if(gen===Q.gen) return qFetch(gen); }); }
      return;
    }
    if(r.status===401){ showGate('登录已过期，请重新输入家庭码。'); qStop(); }
  }).catch(function(){});
}
function qSchedule(gen){
  if(gen!==Q.gen) return;
  if(Q.last && !qPending(Q.last)){ Q.timer=null; return; }   // everything processed: stop
  Q.timer=setTimeout(function(){
    Q.timer=null;
    if(gen!==Q.gen) return;
    if(document.visibilityState==='hidden'){ Q.timer=null; return; }   // resumed by visibilitychange
    qFetch(gen).then(function(){ qSchedule(gen); });
  },qDelay(Date.now()-Q.t0));
}
function qStart(){
  qStop();
  if(!result || !result.queue || !cid) return;
  Q.cid=cid; Q.t0=Date.now(); Q.posted=false;
  var gen=Q.gen;
  qPaint(qSeed());
  qFetch(gen).then(function(){ qSchedule(gen); });
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible' || !Q.cid || Q.timer || (Q.last && !qPending(Q.last))) return;
  var gen=Q.gen; qFetch(gen).then(function(){ qSchedule(gen); });
});
function resetAll(){
  qStop();
  answers={}; imgs={}; cid=null; cidSig=null; cidAt=null; result=null;
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  render(); $('savedHint').textContent=''; submitMsg('');
  window.scrollTo(0,0);
}
// A retry of the same answers keeps the same client_attempt_id (and the same
// answered_at), so the brain recognises it; changed answers get a NEW id.
function submit(retriedOnce){
  if(submitting || result) return;
  var list=payloadAnswers();
  if(imgBusy>0){ submitMsg('图片还在上传，等传完再提交。'); return; }
  var noText=items.filter(function(q){ return imgs[q.qref] && imgs[q.qref].length && !filled(q); });
  if(noText.length){ submitMsg('第 '+noText.map(function(q){ return q.ordinal; }).join('、')+' 题传了图片，请也写一句文字作答（例如“见图”）。'); return; }
  if(!list.length){ submitMsg('还没有作答，先做几道题再提交。'); return; }
  if(!retriedOnce && !isLocal && !window.confirm(confirmText(list))) return;   // cancel: nothing sent, draft untouched
  document.querySelectorAll('#qs .vd.cap').forEach(function(n){ n.remove(); });
  var sig=JSON.stringify(list);
  if(!cid || cidSig!==sig || !cidAt){ cid=newCid(); cidSig=sig; cidAt=new Date().toISOString(); }
  saveDraftNow();
  submitting=true; submitMsg('');
  var btn=$('btnSubmit'); btn.disabled=true; btn.textContent='提交中…'; $('btnClear').disabled=true;
  var body={client_attempt_id:cid,answered_at:cidAt,answers:list};
  if(KIND) body.attempt_kind=KIND;
  var again=false, reload=null;
  api('POST','/api/practice/'+SET_ID+'/grade',body).then(function(r){
    var j=r.json;
    if(r.status===200 && j && j.client_attempt_id===cid && Array.isArray(j.results) && j.summary){
      result=j; saveDraftNow(); applyResult(); fetchQuota(); try{ $('resultCard').scrollIntoView({block:'start'}); }catch(e){} return;
    }
    if(r.status===401){ showGate('登录已过期，请重新输入家庭码；答案还在，登录后再点提交。'); return; }
    var msg=j && typeof j.message==='string' ? j.message : '';
    if(r.status===429 && j && j.error==='daily_cap'){
      // The brain refused the whole batch (nothing written). The site archived the attempt.
      // Answers stay and stay editable; the next submit uses a new id.
      cid=null; cidSig=null; cidAt=null; saveDraftNow();
      var refs=[]; (Array.isArray(j.results)?j.results:[]).forEach(function(x){ if(x&&x.capped===true&&typeof x.qref==='string') refs.push(x.qref); });
      rememberCapped(quota&&quota.day, refs);
      submitMsg(capText());
      markCapped(j); paintQuota(); fetchQuota(); return;
    }
    if(r.status===429){ submitMsg(msg||'提交次数到上限了，请稍后再试。答案还在。'); return; }
    if(r.status===409 && j && j.error==='idempotency_conflict'){
      cid=null; cidSig=null; cidAt=null; saveDraftNow();      // the next submit uses a new id
      if(j.retry_new_id===true && !retriedOnce){ again=true; return; }
      submitMsg(msg||'提交编号冲突，请再点一次「提交」。'); return;
    }
    if(r.status===409 && j && j.error==='rev_mismatch'){
      cid=null; cidSig=null; cidAt=null; saveDraftNow(); reload=msg||'题目已更新，请刷新页面后再提交。'; return;
    }
    if((r.status===400||r.status===409||r.status===404) && msg){ submitMsg('没提交成功：'+msg.replace(/[。]+$/,'')+'。'); return; }
    submitMsg('没提交成功（服务暂时不可用）。答案都还在，稍后再点一次「提交」。');
  }).catch(function(){
    submitMsg('连不上练习站服务。答案都还在，网络好了再点一次「提交」。');
  }).then(function(){
    submitting=false; $('btnClear').disabled=false;
    if(!result){ btn.disabled=false; btn.textContent='提交'; }
    if(again) submit(true);
    else if(reload) load(reload);   // new question versions are fetched; the answers stay
  });
}

// 「检查」 (local test sets only): the server judges, nothing is archived or sent.
function checkAnswers(){
  if(submitting || result || !isLocal) return;
  var list=payloadAnswers().map(function(a){ return {qref:a.qref,answer:a.answer}; });
  if(!list.length){ submitMsg('还没有作答，先做几道题再检查。'); return; }
  submitMsg('');
  var btn=$('btnCheck'); btn.disabled=true;
  api('POST','/api/practice/'+SET_ID+'/check',{answers:list}).then(function(r){
    var j=r.json;
    if(r.status===401){ showGate('登录已过期，请重新输入家庭码；答案还在。'); return; }
    if(r.status===200 && j && Array.isArray(j.results)){
      document.querySelectorAll('#qs .vd.chk').forEach(function(n){ n.remove(); });
      j.results.forEach(function(x){
        var card=document.querySelector('#qs section[data-qref="'+String(x.qref).replace(/"/g,'')+'"]'); if(!card) return;
        var cls='none', txt='未作答';
        if(x.status==='graded' && typeof x.correct==='boolean'){ if(x.correct){ cls='ok'; txt='✓ 答对了'; } else { cls='wrong'; txt='✗ 不对，再试试'; } }
        card.appendChild(el('div','vd chk '+cls,txt));
      });
      return;
    }
    submitMsg((j && typeof j.message==='string' && j.message) ? '没检查成功：'+j.message : '没检查成功，稍后再点一次「检查」。');
  }).catch(function(){ submitMsg('连不上练习站服务，网络好了再点一次「检查」。'); })
  .then(function(){ btn.disabled=false; });
}

// ---- wiring --------------------------------------------------------------------
$('gateForm').addEventListener('submit',function(ev){
  ev.preventDefault();
  var code=$('gateInput').value; if(!code.trim()) return;
  $('gateBtn').disabled=true; $('gateErr').textContent='';
  api('POST','/api/login',{code:code}).then(function(r){
    $('gateInput').value='';
    if(r.status===200){ hideGate(); load(); }
    else if(r.status===429){ $('gateErr').textContent='尝试次数太多，请一分钟后再试'; }
    else if(r.status===401){ $('gateErr').textContent='家庭码不对'; }
    else { $('gateErr').textContent='登录失败，请稍后再试'; }
  }).catch(function(){ $('gateErr').textContent='连不上练习站服务'; })
  .then(function(){ $('gateBtn').disabled=false; });
});
$('btnClear').onclick=function(){
  if(submitting) return;
  if(!confirm('清空本页填写？')) return;
  resetAll();
};
$('btnSubmit').onclick=function(){ submit(false); };
$('btnCheck').onclick=checkAnswers;
$('btnLogout').onclick=function(){
  api('POST','/api/logout').then(function(){
    qStop(); items=[]; $('qs').innerHTML=''; $('submitCard').style.display='none'; $('resultCard').style.display='none'; $('countPill').textContent='已退出'; showGate('');
  },function(){});
};
window.addEventListener('pagehide',saveDraftNow);
document.addEventListener('visibilitychange',function(){ if(document.hidden) saveDraftNow(); });
start();
})();
</script>
